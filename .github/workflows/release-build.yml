name: Build release artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: ./gradlew :android-app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WiredCam-Android-debug-APK
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
          if-no-files-found: error

  windows-dashboard:
    name: Windows dashboard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package Windows application
        shell: pwsh
        run: ./web-app/package.ps1
      - name: Add usage note
        shell: pwsh
        run: |
          @"
          WiredCam for Windows

          Run WiredCam.exe. It opens a local browser dashboard at http://127.0.0.1:8765.
          Install Android Platform Tools and put adb.exe on PATH, or place its platform-tools folder next to WiredCam.exe.
          "@ | Set-Content web-app/dist/WiredCam/README-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WiredCam-Windows
          path: web-app/dist/WiredCam
          if-no-files-found: error
